# Сборка страницы CoreTalk. Собирается ЗДЕСЬ, а не на машине заказчика.
#
# Почему не там: узел `srv-desk` делит восемь ядер и пятнадцать гигабайт с
# задачником и службой поддержки BritiTrade. Сборка Vite на нём 08.09.2026
# дважды забрала всю память — средняя загрузка дошла до 95, службы перестали
# отвечать. Машина отдаёт страницу, а не строит её.
name: Страница — сборка и выпуск

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Менеджер пакетов из репозитория
        run: corepack enable

      - name: Зависимости
        run: pnpm install --frozen-lockfile

      - name: Сборка
        run: pnpm run build

      # Архив несёт в себе отметку версии: по ней роль Ansible понимает, что
      # уже выложено, и не качает то же самое второй раз.
      - name: Архив страницы
        run: |
          echo "${GITHUB_SHA}" > dist/.built-sha
          tar -czf coretalk-web.tar.gz -C dist .

      - name: Выпуск с архивом
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-${{ github.sha }}
          name: Страница CoreTalk ${{ github.sha }}
          files: coretalk-web.tar.gz
          prerelease: false
          make_latest: true
